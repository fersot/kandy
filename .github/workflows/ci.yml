name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Tests y lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias de sistema (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            librsvg2-dev libdbus-1-dev build-essential

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend (vue-tsc + vite)
        run: |
          npm ci
          npm run build

      - name: Formato Rust
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  flatpak:
    name: Flatpak
    needs: check
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.fersot.Kandy.yml
          bundle: kandy.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Publicar en la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: kandy.flatpak
          generate_release_notes: true
