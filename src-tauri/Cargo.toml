[package]
name = "kandy"
version = "0.1.0"
description = "Calendario de escritorio que unifica Google, Microsoft, Zoho, CalDAV e ICS"
authors = ["FERSOFT"]
license = "MIT"
repository = "https://github.com/fersot/kandy"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
rrule = "0.14"
rusqlite = { version = "0.41", features = ["bundled"] }
roxmltree = "0.21"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"
futures = "0.3"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
